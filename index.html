<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><link rel="icon" type="image/png" href="/assets/ui/ui-oxygen-pixel.png"/><title>Mission Ripple · Mars Outpost</title></head><body>
<div id="app"><div id="game"></div><div id="hud">
